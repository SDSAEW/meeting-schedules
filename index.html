<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="جداول لقاءات بذور وجذور وإشراق وإثمار 2 وإثمار 3، مع عرض المواعيد حسب توقيت مدينتك.">
  <title>جداول اللقاءات</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#faf8fc;color:#2b1745;font-family:Tahoma,"Segoe UI",sans-serif;line-height:1.8}
    main{max-width:720px;margin:auto;padding:64px 20px}
    header{text-align:center;margin-bottom:36px}
    h1{font-size:2rem;margin:0 0 12px}
    p{color:#6f5f86;margin:0}
    nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
    a{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:24px;border:1px solid #e1d5ef;border-radius:16px;background:#fff;color:#682e8f;text-decoration:none;font-size:1.2rem;font-weight:bold}
    a:hover{background:#f1e9f9;border-color:#682e8f}
    a:focus-visible{outline:3px solid #682e8f;outline-offset:4px}
    a span{font-size:1.5rem}
    footer{text-align:center;margin-top:32px;font-size:.9rem;color:#6f5f86}
    @media(max-width:480px){main{padding-top:36px}nav{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main>
    <header>
      <h1>جداول اللقاءات</h1>
      <p>اختر برنامجك للاطلاع على اللقاءات الأسبوعية وأوقاتها حسب مدينتك.</p>
    </header>
    <nav aria-label="جداول البرامج">
      <a href="budhur/">بذور <span aria-hidden="true">←</span></a>
      <a href="judhur/">جذور <span aria-hidden="true">←</span></a>
      <a href="ishraq/">إشراق <span aria-hidden="true">←</span></a>
      <a href="ithmar-2/">إثمار 2 <span aria-hidden="true">←</span></a>
      <a href="ithmar-3/">إثمار 3 <span aria-hidden="true">←</span></a>
    </nav>
    <footer>يمكن مشاركة رابط كل جدول مباشرة.</footer>
  </main>
</body>
</html>
